[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills-tooling"
version = "0.1.0"
description = "Build, validate, and package the Agent Skills in this repo's agent-skills/.agents/skills/"
requires-python = ">=3.10"
dependencies = [
    "nbformat>=5.10",
]

[project.scripts]
agent-skills = "agent_skills_tooling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest"]
